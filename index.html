<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tin học vui – Lớp 4, Lớp 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;subset=vietnamese&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=1114b">
<!-- ?v=... makes readers that keep old files (Kindle) fetch the new ones; change it when these files change -->
<script src="assets/js/errbox.js?v=1114b"></script>
<script src="assets/js/icons.js?v=1114b" onerror="__miss(this)"></script>
<script src="assets/js/lessons.js?v=1114b" onerror="__miss(this)"></script>
<script src="assets/js/core.js?v=1114b" onerror="__miss(this)"></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="ico" id="brand-ico"></span>Tin học vui</a>
    <div class="topbar-right">
      <button class="btn btn-small" id="view-toggle" type="button">Xem danh sách</button>
      <a class="btn btn-small" href="huongdan.html">Hướng dẫn</a>
      <button class="btn btn-small" id="eink-toggle" aria-pressed="false">Màn hình mực</button>
    </div>
  </div>
</header>

<main class="wrap home-cols">
  <div class="home-side">
    <section class="hero">
      <h1>Chào em! Anh là Bíp.</h1>
      <p>Cùng Bíp học Tin học lớp 4 và lớp 5 bằng cách chạm, xếp, thử và chơi nha.</p>
    </section>

    <section class="card profile-box" aria-labelledby="who-title">
      <h2 id="who-title">Ai đang học?</h2>
      <div id="who-box"></div>
    </section>

    <div class="grade-tabs" role="group" aria-label="Chọn lớp">
      <button class="btn" data-grade="4" aria-pressed="true">Lớp 4</button>
      <!-- grade 5 is switched off for now: remove "disabled" and the "(sắp có)" text to bring it back -->
      <button class="btn" data-grade="5" aria-pressed="false" disabled>Lớp 5 (sắp có)</button>
    </div>
    <ul class="topic-legend" id="topic-legend" aria-label="Các chủ đề"></ul>
    <p class="footer home-note">Bài học bám theo chương trình Tin học lớp 4, lớp 5 (bộ Kết nối tri thức). Nội dung và hình vẽ được soạn lại cho web, không sao chép sách.</p>
  </div>

  <div class="home-main">
    <button class="gate-note" id="gate-note" type="button">Em nhập tên ở ô <b>Ai đang học?</b> để bắt đầu học nha.</button>
    <div id="lessons"></div>
  </div>
</main>

<script>
(function () {
  /* the lesson list lives in assets/js/lessons.js (one source for this page and game.js) */
  var GRADES = window.LESSON_GRADES;
  var GRADE_KEY = 'whth-grade';

  /* the wide stage shows two columns (see main.css); narrow screens show one list */
  function isWide() {
    if (window.Core && Core.isStage) return Core.isStage();
    return !!(window.matchMedia && window.matchMedia('(min-width: 900px) and (orientation: landscape)').matches);
  }
  var shownGrade = null;
  window.addEventListener('resize', function () {
    var host = document.getElementById('lessons');
    if (shownGrade && host.getAttribute('data-wide') !== (isWide() ? '1' : '0')) renderLessons(shownGrade);
  });

  function renderLessons(grade) {
    shownGrade = grade;
    var host = document.getElementById('lessons');
    /* A grid of equal cards: every row counts as one lesson (9A and 9B are two).
       On the wide stage the first half is the left column and the rest the right
       column, row by row, so both sides line up. Each card carries a small
       "Chủ đề N" tag; the legend on the left gives the topic names. */
    var topics = GRADES[grade], cards = [], legend = '';
    for (var i = 0; i < topics.length; i++) {
      var ls = topics[i].lessons, tp = i + 1;
      legend += '<li><span class="topic-dot tp-' + tp + '" title="Chủ đề ' + tp + '">' + tp + '</span><span>' + topics[i].topic.replace(/^Chủ đề \d+\.\s*/, '') + '</span></li>';
      for (var j = 0; j < ls.length; j++) {
        var l = ls[j], tag = '<span class="topic-tag tp-' + tp + '">Chủ đề ' + tp + '</span>';
        if (l.href) {
          cards.push('<a class="lesson-item" href="' + l.href + '" title="' + topics[i].topic + '"><span class="lesson-num tp-' + tp + '">' + l.n + '</span>' +
            '<span class="lesson-body"><span class="t">' + l.t + '</span><span class="lesson-meta">' + tag +
            '<span class="stars" data-stars-for="' + l.id + '" data-stars-total="' + l.stars + '"></span></span></span></a>');
        } else {
          cards.push('<div class="lesson-item soon"><span class="lesson-num">' + l.n + '</span>' +
            '<span class="lesson-body"><span class="t">' + l.t + '</span><span class="lesson-meta">' + tag + '<span class="tag-soon">Sắp có</span></span></span></div>');
        }
      }
    }
    var html = '', half = Math.ceil(cards.length / 2), view = getView();
    if (isWide() && view === 'map') {
      html = mapHTML(topics);
    } else if (isWide()) {
      for (var r = 0; r < half; r++) html += '<div class="lesson-row">' + cards[r] + (cards[half + r] || '<span class="lesson-gap"></span>') + '</div>';
    } else {
      html = '<div class="lesson-flat">' + cards.join('') + '</div>';
    }
    host.innerHTML = html;
    host.setAttribute('data-wide', isWide() ? '1' : '0');
    var lg = document.getElementById('topic-legend');
    if (lg) lg.innerHTML = legend;
    var tabs = document.querySelectorAll('[data-grade]');
    for (var k = 0; k < tabs.length; k++) tabs[k].setAttribute('aria-pressed', tabs[k].getAttribute('data-grade') === grade ? 'true' : 'false');
    try { localStorage.setItem(GRADE_KEY, grade); } catch (e) {}
    var vt = document.getElementById('view-toggle');
    if (vt) vt.innerHTML = view === 'map' ? 'Xem danh sách' : 'Xem bản đồ';
    Core.renderStars();
    if (Core.refreshBip) Core.refreshBip();
  }

  /* ---------- adventure map (wide stage only): the lessons along a winding road, Bíp at the next lesson to do ---------- */
  var VIEW_KEY = 'whth-view';
  function getView() { var v = 'map'; try { v = localStorage.getItem(VIEW_KEY) || 'map'; } catch (e) {} return v; }
  function mapHTML(topics) {
    var nodes = [], i, j, n, cols = 6, rowH = 204, pts = [], html = '', cur = -1;
    for (i = 0; i < topics.length; i++) for (j = 0; j < topics[i].lessons.length; j++) nodes.push({ l: topics[i].lessons[j], tp: i + 1 });
    if (Core.currentName()) for (n = 0; n < nodes.length && cur < 0; n++) if (Core.countStars(nodes[n].l.id) < nodes[n].l.stars) cur = n;
    for (n = 0; n < nodes.length; n++) {
      var r = Math.floor(n / cols), c = n % cols, l = nodes[n].l;
      if (r % 2) c = cols - 1 - c;
      var x = (c + 0.5) * 100, y = 46 + r * rowH;
      pts.push(x + ',' + y);
      html += '<a class="map-node' + (n === cur ? ' is-current' : '') + '" href="' + l.href + '" title="' + topics[nodes[n].tp - 1].topic + '" style="left:' + (x / 6).toFixed(2) + '%;top:' + (y - 30) + 'px">' +
        (n === cur ? '<span class="map-bip" data-bip="1"><span class="bip-mini"></span></span>' : '') +
        '<span class="map-dot lesson-num tp-' + nodes[n].tp + '">' + l.n + '</span><span class="map-t">' + l.t + '</span>' +
        '<span class="stars map-stars" data-stars-for="' + l.id + '" data-stars-total="' + l.stars + '"></span></a>';
    }
    var H = Math.ceil(nodes.length / cols) * rowH;
    return '<div class="lesson-map" style="height:' + H + 'px"><svg class="map-path" viewBox="0 0 600 ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline class="map-road" points="' + pts.join(' ') + '"/><polyline class="map-dash" points="' + pts.join(' ') + '"/></svg>' + html + '</div>';
  }

  /* ---------- boss challenges: one per topic (thuthach.html) ---------- */
  function bossMenu() {
    var g = shownGrade || '4', rows = '';
    for (var t = 1; t <= 6; t++) {
      var won = Core.gems && Core.gems.bossWon(g, t);
      rows += '<li><span class="topic-tag tp-' + t + '">Chủ đề ' + t + '</span><span class="boss-name">' + GRADES[g][t - 1].topic.replace(/^Chủ đề \d+\.\s*/, '') + '</span>' +
        (won ? '<b class="boss-won">Đã thắng</b>' : '') + '<a class="btn btn-small' + (won ? '' : ' btn-primary') + '" href="thuthach.html?g=' + g + '&amp;t=' + t + '">' + (won ? 'Đấu lại' : 'Vào đấu') + '</a></li>';
    }
    var m = Core.el('div', 'bip-modal', '<div class="bip-card boss-menu" role="dialog" aria-modal="true"><div class="bip-card-head"><h2>Thử thách diệt Bọ Lỗi · Lớp ' + g + '</h2>' +
      '<button class="btn btn-small" type="button" id="boss-close">Đóng ✕</button></div>' +
      '<p>Mỗi chủ đề có một con Bọ Lỗi. Em trả lời đúng các câu hỏi của chủ đề để đánh bại nó. Thắng lần đầu được 3 kim cương.</p><ul class="boss-list">' + rows + '</ul></div>');
    document.body.appendChild(m);
    function close() { if (m.parentNode) document.body.removeChild(m); }
    Core.on(document.getElementById('boss-close'), close);
    Core.on(m, function (e) { if (e && e.target === m) close(); });
  }

  /* ---------- class goal: totals from the teacher's sheet (needs the "stats" action in tools/sheet-sync.gs) ---------- */
  function classGoal() {
    var el = document.getElementById('class-goal');
    if (!el || !Core.sync || !Core.sync.on) return;
    function paint(d) {
      if (!d || !(d.learners > 0)) { el.innerHTML = ''; return; }
      var goal = Math.max(100, Math.ceil((d.stars + 1) / 100) * 100);
      el.innerHTML = 'Cả lớp: <b>' + d.learners + '</b> bạn · <b>' + d.stars + '</b> sao. Mục tiêu chung: <b>' + goal + '</b> sao!' +
        '<span class="goal-bar"><span style="width:' + Math.round(d.stars / goal * 100) + '%"></span></span>';
    }
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('whth-class') || 'null'); } catch (e) {}
    if (cached) paint(cached);
    if (cached && new Date().getTime() - cached.at < 5 * 60 * 1000) return;
    Core.sync.stats(function (err, res) {
      if (err || !res) return;
      var d = { learners: res.learners, stars: res.stars, at: new Date().getTime() };
      try { localStorage.setItem('whth-class', JSON.stringify(d)); } catch (e) {}
      paint(d);
    });
  }

  /* ---------- who is learning: a name is needed to start, and each name has a 4-digit code ---------- */
  function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

  /* big card shown once, right after a new name is made */
  function showCode(name, changed) {
    var m = Core.el('div', 'bip-modal', '<div class="bip-card code-card" role="dialog" aria-modal="true">' +
      '<h2>Chào ' + esc(name) + '!</h2>' +
      '<p>' + (changed ? 'Mã số em chọn đã có bạn khác dùng, nên em được đổi sang mã số mới:' : 'Mã số của em là') + '</p>' +
      '<div class="code-big" aria-label="Mã số ' + Core.codeOf(name).split('').join(' ') + '">' + Core.codeOf(name) + '</div>' +
      '<p><b>Em hãy ghi nhớ mã số này</b> (chép vào vở cho chắc). Lần sau em cần <b>tên</b> và <b>mã số</b> để học tiếp và giữ sao của mình.</p>' +
      '<button class="btn btn-primary" type="button">Em đã ghi nhớ rồi</button></div>');
    document.body.appendChild(m);
    Core.on(m.querySelector('button'), function () { document.body.removeChild(m); });
  }

  /* a name that is already on this device opens only with its code */
  function askCode(name, note) {
    var box = document.getElementById('who-box');
    box.innerHTML = '<div id="code-ask"><form id="code-form" autocomplete="off"><label for="code-in">Mã số của <b>' + esc(name) + '</b>:</label>' +
      '<div class="who-row"><input class="input" id="code-in" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 chữ số" aria-label="Mã số 4 chữ số">' +
      '<button class="btn btn-primary" type="submit">Vào học</button></div></form></div>' +
      '<button class="btn btn-small" id="code-back" type="button">&lsaquo; Tên khác</button><div class="feedback" id="who-fb"></div>' +
      '<div class="who-forgot"><b>Quên mã số?</b> Em hỏi thầy cô: thầy cô tra được mã số của em, và xoá được tên này khỏi máy.' +
      '<button class="btn btn-small" id="code-del" type="button">Xoá tên này (cần thầy cô)</button></div>';
    var input = document.getElementById('code-in'), fb = document.getElementById('who-fb');
    if (note) Core.say(fb, note, 'info');
    Core.on(document.getElementById('code-back'), renderNames);
    /* a forgotten code: the name can be removed from this device (asked twice, because the stars kept on this device go with it) */
    Core.on(document.getElementById('code-del'), function () { teacherDelete(name); });
    input.focus();
    document.getElementById('code-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (Core.checkCode(name, input.value)) { Core.useProfile(name); refresh(); }
      else { Core.say(fb, 'Mã số chưa đúng. Em nhớ lại, hoặc hỏi thầy cô nha.', 'bad'); input.value = ''; input.focus(); }
    });
  }

  /* a learner who started on another device gets the stars back from the teacher's sheet (sync.js) */
  function askRestore(name, note) {
    if (typeof name !== 'string') name = note = '';   /* called from a button click */
    var box = document.getElementById('who-box');
    box.innerHTML = '<div id="code-ask"><form id="restore-form" autocomplete="off"><label for="re-name">Tên và mã số của em:</label>' +
      '<div class="who-row"><input class="input" id="re-name" maxlength="20" placeholder="Tên em" aria-label="Tên của em">' +
      '<input class="input" id="re-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Mã số" aria-label="Mã số 4 chữ số"></div>' +
      '<button class="btn btn-primary" type="submit" id="re-go">Lấy lại bài học</button></form></div>' +
      '<button class="btn btn-small" id="code-back" type="button">&lsaquo; Quay lại</button><div class="feedback" id="who-fb"></div>';
    var fb = document.getElementById('who-fb'), go = document.getElementById('re-go');
    Core.on(document.getElementById('code-back'), renderNames);
    if (name) document.getElementById('re-name').value = name;
    if (note) Core.say(fb, note, 'info');
    document.getElementById(name ? 're-code' : 're-name').focus();
    document.getElementById('restore-form').addEventListener('submit', function (e) {
      e.preventDefault();
      go.disabled = true;
      Core.say(fb, 'Đang tìm bài học của em...', 'info');
      Core.sync.restore(document.getElementById('re-name').value, document.getElementById('re-code').value, function (err) {
        go.disabled = false;
        if (!err) { refresh(); return; }
        Core.say(fb, err === 'bad' ? 'Em nhập đủ tên và mã số 4 chữ số nha.' :
          err === 'notfound' ? 'Không tìm thấy tên và mã số này. Em kiểm tra lại từng chữ, từng số nha.' :
          'Chưa kết nối được mạng. Em thử lại sau, hoặc nhờ thầy cô.', err === 'bad' ? 'info' : 'bad');
      });
    });
  }

  /* removing a learner from this device needs the teacher: the teacher's password is checked by the sheet script
     (action "checkKey"), never here. Without a sheet there is nobody to ask, so a plain question is all there is. */
  function teacherDelete(name) {
    function remove() {
      Core.removeProfile(name);
      refresh();
      var f = document.getElementById('who-fb');
      if (f) Core.say(f, 'Đã xoá tên "' + esc(name) + '" khỏi máy này.', 'info');
    }
    if (!Core.sync || !Core.sync.on) {
      if (confirm('Xoá tên "' + name + '" khỏi máy này?\n\nSao của bạn ấy lưu trên máy này sẽ mất và không lấy lại được.')) remove();
      return;
    }
    var box = document.getElementById('who-box');
    box.innerHTML = '<div id="code-ask"><form id="del-form" autocomplete="off"><label for="del-key">Xoá tên <b>' + esc(name) + '</b> khỏi máy này cần <b>mật khẩu của thầy cô</b>:</label>' +
      '<div class="who-row"><input class="input" id="del-key" type="password" placeholder="Mật khẩu giáo viên" aria-label="Mật khẩu giáo viên">' +
      '<button class="btn btn-primary" type="submit" id="del-go">Xoá tên</button></div></form></div>' +
      '<button class="btn btn-small" id="code-back" type="button">&lsaquo; Thôi, không xoá</button><div class="feedback" id="who-fb"></div>' +
      '<p class="who-forgot">Sao của bạn ấy lưu trên máy này sẽ mất. Kết quả đã gửi lên mạng thì vẫn còn trong bảng của thầy cô.</p>';
    var fb = document.getElementById('who-fb'), go = document.getElementById('del-go'), key = document.getElementById('del-key');
    Core.on(document.getElementById('code-back'), renderNames);
    key.focus();
    document.getElementById('del-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!key.value) { Core.say(fb, 'Thầy cô nhập mật khẩu trước.', 'info'); return; }
      go.disabled = true;
      Core.say(fb, 'Đang kiểm tra mật khẩu...', 'info');
      Core.sync.call({ action: 'checkKey', key: key.value }, function (err, res) {
        go.disabled = false;
        if (!err) { remove(); return; }
        var why = res && res.error;
        key.value = '';
        Core.say(fb, why === 'bad key' ? 'Mật khẩu chưa đúng.' :
          why === 'no key set' ? 'Thầy cô chưa đặt mật khẩu giáo viên trong bảng tính.' :
          'Chưa kiểm tra được mật khẩu. Cần có mạng để thầy cô xác nhận.', 'bad');
      });
    });
  }

  function renderNames() {
    var p = Core.profiles(), cur = p.current, box = document.getElementById('who-box');
    if (cur) {
      box.innerHTML = '<p class="who who-now">Đang học: <b>' + esc(cur) + '</b><br>Mã số của em: <b class="who-code">' + Core.codeOf(cur) + '</b></p>' +
        '<div class="who-row"><button class="btn btn-small" id="who-out" type="button">Bạn khác vào học</button>' +
        '<button class="btn btn-small" id="who-del" type="button">Xoá tên này</button></div>' +
        (Core.gems ? '<div class="who-row who-game"><span class="who-gems" title="Kim cương: làm đúng ngay lần đầu">' + Core.gemIcon + '<b>' + Core.gems.count() + '</b></span>' +
          '<button class="btn btn-small" id="who-badges" type="button">Huy hiệu ' + Core.badgeCount() + '</button>' +
          '<button class="btn btn-small" id="who-boss" type="button">Thử thách</button></div>' : '') +
        '<p class="who sync-state" data-sync-state></p><p class="who class-goal" id="class-goal"></p>';
      if (Core.sync) Core.sync.paint();
      if (Core.gems) {
        Core.on(document.getElementById('who-badges'), Core.badges);
        Core.on(document.getElementById('who-boss'), bossMenu);
      }
      classGoal();
      Core.on(document.getElementById('who-out'), function () { Core.logout(); refresh(); });
      Core.on(document.getElementById('who-del'), function () { teacherDelete(cur); });
      /* the sheet gave this learner another code (the first one was somebody else's): show it once, big */
      try {
        var nc = JSON.parse(localStorage.getItem('whth-newcode') || '{}');
        if (nc[cur]) { delete nc[cur]; localStorage.setItem('whth-newcode', JSON.stringify(nc)); showCode(cur, true); }
      } catch (e) {}
    } else {
      /* a learner gives a name and chooses a 4-digit code. The code is the learner's key:
         nobody else may have it, on this device or in the teacher's sheet. */
      box.innerHTML = '<p class="who">Em nhập <b>tên</b> và tự chọn một <b>mã số 4 chữ số</b> của riêng mình.' + (p.list.length ? ' Bạn nào học trên máy này rồi thì chạm vào tên của mình.' : '') + '</p>' +
        '<div class="names" id="names"></div>' +
        '<form id="add-name" autocomplete="off"><div class="who-row"><input class="input" id="new-name" maxlength="20" placeholder="Tên em" aria-label="Tên của em">' +
        '<input class="input" id="new-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Mã số" aria-label="Mã số 4 chữ số em tự chọn"></div>' +
        '<button class="btn btn-primary" type="submit" id="new-go">Vào học</button></form><div class="feedback" id="who-fb"></div>' +
        '<a class="help-link" href="huongdan.html#dang-nhap">Xem hướng dẫn đăng nhập &rsaquo;</a>';
      var names = document.getElementById('names'), fb = document.getElementById('who-fb');
      for (var i = 0; i < p.list.length; i++) {
        (function (name) {
          var b = Core.el('button', 'btn btn-small', esc(name));
          b.type = 'button';
          Core.on(b, function () { askCode(name); });
          names.appendChild(b);
        })(p.list[i]);
      }
      var force = '';   /* the name a learner confirmed as "I am a new learner", after the sheet said the name exists */
      /* the chosen code is taken: say so and offer a free one */
      function taken(code, suggest) {
        Core.say(fb, 'Mã số <b>' + code + '</b> đã có bạn khác dùng rồi. Em chọn mã khác nha' + (suggest ? ', ví dụ: <b>' + suggest + '</b>' : '') + '.' +
          (suggest ? ' <button class="btn btn-small" type="button" id="use-code">Dùng mã ' + suggest + '</button>' : ''), 'bad');
        var u = document.getElementById('use-code'), input = document.getElementById('new-code');
        if (u) Core.on(u, function () { input.value = suggest; fb.className = 'feedback'; fb.innerHTML = ''; });
        input.value = ''; input.focus();
      }
      document.getElementById('add-name').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = Core.cleanName(document.getElementById('new-name').value), code = document.getElementById('new-code').value.replace(/\D/g, '');
        if (!name) { Core.say(fb, 'Em gõ tên của mình vào ô trước nha.', 'info'); return; }
        if (code.length !== 4) { Core.say(fb, 'Em tự chọn một mã số có đúng <b>4 chữ số</b>, ví dụ: ' + Core.freeCode() + '.', 'info'); return; }
        if (Core.hasProfile(name)) {
          if (Core.checkCode(name, code)) { Core.useProfile(name); refresh(); return; }
          askCode(name, 'Trên máy này đã có bạn tên ' + esc(name) + ' với mã số khác. Nếu là em, hãy nhập đúng mã số của mình. Nếu em là bạn khác trùng tên, bấm Tên khác rồi thêm một chữ vào tên, ví dụ: ' + esc(name) + ' B.');
          return;
        }
        if (Core.codeOwner(code)) { taken(code, Core.freeCode()); return; }
        function create() { Core.addProfile(name, code); refresh(); showCode(name); }
        /* no sheet, or the sheet cannot be reached: the learner still gets in (the sheet settles a clash later) */
        if (!Core.sync || !Core.sync.on || name.indexOf('__') === 0) { create(); return; }
        var go = document.getElementById('new-go');
        go.disabled = true;
        Core.say(fb, 'Đang kiểm tra mã số...', 'info');
        Core.sync.call({ action: 'enter', name: name, code: code, force: force === name }, function (err, res) {
          go.disabled = false;
          if (err || !res) { create(); return; }
          if (res.found) { Core.restoreProfile(Core.cleanName(res.name || name), code, res.progress); refresh(); return; }   /* the learner already exists: back in, with the stars */
          if (res.taken) { taken(code, Core.codeOwner(res.suggest) ? Core.freeCode() : res.suggest); return; }
          if (res.nameExists) {
            Core.say(fb, 'Tên <b>' + esc(name) + '</b> đã có trong lớp với mã số khác. Nếu em là bạn đó, hãy nhập đúng mã số cũ. Nếu em là bạn mới trùng tên: ' +
              '<button class="btn btn-small" type="button" id="new-me">Em là bạn mới</button>', 'info');
            Core.on(document.getElementById('new-me'), function () { force = name; go.click(); });
            return;
          }
          /* created in the sheet: now on this device */
          create();
        });
      });
    }
    /* lessons open only when someone is learning */
    var main = document.querySelector('.home-main'), note = document.getElementById('gate-note');
    main.className = 'home-main' + (cur ? '' : ' is-locked');
    document.querySelector('.home-side').className = 'home-side' + (cur ? '' : ' no-learner');
    note.style.display = cur ? 'none' : '';
  }

  function refresh() { renderNames(); if (shownGrade) renderLessons(shownGrade); else Core.renderStars(); }
  Core.onGameReady = function () { refresh(); };   /* game.js loads after the first draw: medals, gems and badges appear then */

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('brand-ico').innerHTML = Icons.robot;
    var grade = '4';
    try { grade = localStorage.getItem(GRADE_KEY) || '4'; } catch (e) {}
    /* a grade whose button is switched off cannot be opened, even if it was the last one used */
    var gb = document.querySelector('[data-grade="' + grade + '"]');
    if (!gb || gb.disabled) grade = '4';
    renderLessons(grade);
    renderNames();
    var tabs = document.querySelectorAll('[data-grade]');
    for (var k = 0; k < tabs.length; k++) {
      (function (t) { Core.on(t, function () { if (!t.disabled) renderLessons(t.getAttribute('data-grade')); }); })(tabs[k]);
    }
    /* a locked lesson card, or a lesson page opened without a name (#ten), points to the name box */
    function nudge() {
      var input = document.getElementById('new-name'), fb = document.getElementById('who-fb');
      if (!input) return;
      Core.say(fb, 'Em nhập tên ở ô <b>Ai đang học?</b> trước rồi mới vào học được nha.', 'info');
      input.focus();
      var whoBox = document.getElementById('who-box') || document.querySelector('.profile-box');
      if (whoBox && whoBox.scrollIntoView) {
        try { whoBox.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { whoBox.scrollIntoView(true); }
      }
    }
    document.getElementById('gate-note').addEventListener('click', nudge, false);
    Core.on(document.getElementById('view-toggle'), function () {
      try { localStorage.setItem(VIEW_KEY, getView() === 'map' ? 'list' : 'map'); } catch (e) {}
      renderLessons(shownGrade);
    });
    if (location.hash === '#ten' && !Core.currentName()) nudge();
  });
})();
</script>
</body>
</html>
