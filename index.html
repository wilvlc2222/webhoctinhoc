<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tin học vui – Lớp 4, Lớp 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;subset=vietnamese&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<script src="assets/js/icons.js"></script>
<script src="assets/js/core.js"></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="ico" id="brand-ico"></span>Tin học vui</a>
    <div class="topbar-right">
      <a class="btn btn-small" href="huongdan.html">Hướng dẫn</a>
      <button class="btn btn-small" id="eink-toggle" aria-pressed="false">Màn hình mực</button>
    </div>
  </div>
</header>

<main class="wrap home-cols">
  <div class="home-side">
    <section class="hero">
      <h1>Chào em! Mình là Bíp.</h1>
      <p>Cùng Bíp học Tin học lớp 4 và lớp 5 bằng cách chạm, xếp, thử và chơi nha.</p>
    </section>

    <section class="card profile-box" aria-labelledby="who-title">
      <h2 id="who-title">Ai đang học?</h2>
      <div id="who-box"></div>
    </section>

    <div class="grade-tabs" role="group" aria-label="Chọn lớp">
      <button class="btn" data-grade="4" aria-pressed="true">Lớp 4</button>
      <button class="btn" data-grade="5" aria-pressed="false">Lớp 5</button>
    </div>
    <ul class="topic-legend" id="topic-legend" aria-label="Các chủ đề"></ul>
    <p class="footer home-note">Bài học bám theo chương trình Tin học lớp 4, lớp 5 (bộ Kết nối tri thức). Nội dung và hình vẽ được soạn lại cho web, không sao chép sách.</p>
  </div>

  <div class="home-main">
    <div id="lessons"></div>
    <button class="gate-note" id="gate-note" type="button">Em nhập tên ở bên trái để bắt đầu học nha.</button>
  </div>
</main>

<script>
(function () {
  /* href set = lesson is ready; stars = number of activities that give a star */
  var GRADES = {
    '4': [
      { topic: 'Chủ đề 1. Máy tính và em', lessons: [
        { n: 1, t: 'Phần cứng và phần mềm máy tính', id: 'l4-b01', href: 'lop4/bai01.html', stars: 9 },
        { n: 2, t: 'Gõ bàn phím đúng cách', id: 'l4-b02', href: 'lop4/bai02.html', stars: 11 } ] },
      { topic: 'Chủ đề 2. Mạng máy tính và Internet', lessons: [ { n: 3, t: 'Thông tin trên trang web', id: 'l4-b03', href: 'lop4/bai03.html', stars: 11 } ] },
      { topic: 'Chủ đề 3. Tổ chức lưu trữ, tìm kiếm và trao đổi thông tin', lessons: [
        { n: 4, t: 'Tìm kiếm thông tin trên Internet', id: 'l4-b04', href: 'lop4/bai04.html', stars: 11 }, { n: 5, t: 'Thao tác với tệp và thư mục', id: 'l4-b05', href: 'lop4/bai05.html', stars: 13 } ] },
      { topic: 'Chủ đề 4. Đạo đức, pháp luật và văn hoá trong môi trường số', lessons: [ { n: 6, t: 'Sử dụng phần mềm khi được phép', id: 'l4-b06', href: 'lop4/bai06.html', stars: 10 } ] },
      { topic: 'Chủ đề 5. Ứng dụng tin học', lessons: [
        { n: 7, t: 'Tạo bài trình chiếu', id: 'l4-b07', href: 'lop4/bai07.html', stars: 11 }, { n: 8, t: 'Định dạng văn bản trên trang chiếu', id: 'l4-b08', href: 'lop4/bai08.html', stars: 10 }, { n: 9, t: 'Hiệu ứng chuyển trang', id: 'l4-b09', href: 'lop4/bai09.html', stars: 9 },
        { n: 10, t: 'Phần mềm soạn thảo văn bản', id: 'l4-b10', href: 'lop4/bai10.html', stars: 10 }, { n: 11, t: 'Chỉnh sửa văn bản', id: 'l4-b11', href: 'lop4/bai11.html', stars: 12 },
        { n: '12A', t: 'Thực hành sử dụng công cụ đa phương tiện', id: 'l4-b12a', href: 'lop4/bai12a.html', stars: 5 }, { n: '12B', t: 'Phần mềm luyện gõ bàn phím', id: 'l4-b12b', href: 'lop4/bai12b.html', stars: 6 } ] },
      { topic: 'Chủ đề 6. Giải quyết vấn đề với sự trợ giúp của máy tính', lessons: [
        { n: 13, t: 'Chơi với máy tính', id: 'l4-b13', href: 'lop4/bai13.html', stars: 9 }, { n: 14, t: 'Khám phá môi trường lập trình trực quan', id: 'l4-b14', href: 'lop4/bai14.html', stars: 9 },
        { n: 15, t: 'Tạo chương trình máy tính để diễn tả ý tưởng', id: 'l4-b15', href: 'lop4/bai15.html', stars: 9 }, { n: 16, t: 'Chương trình của em', id: 'l4-b16', href: 'lop4/bai16.html', stars: 7 } ] }
    ],
    '5': [
      { topic: 'Chủ đề 1. Máy tính và em', lessons: [ { n: 1, t: 'Em có thể làm gì với máy tính?', id: 'l5-b01', href: 'lop5/bai01.html', stars: 6 } ] },
      { topic: 'Chủ đề 2. Mạng máy tính và Internet', lessons: [ { n: 2, t: 'Tìm kiếm thông tin trên website', id: 'l5-b02', href: 'lop5/bai02.html', stars: 9 } ] },
      { topic: 'Chủ đề 3. Tổ chức lưu trữ, tìm kiếm và trao đổi thông tin', lessons: [
        { n: 3, t: 'Tìm kiếm thông tin trong giải quyết vấn đề', id: 'l5-b03', href: 'lop5/bai03.html', stars: 10 }, { n: 4, t: 'Cây thư mục', id: 'l5-b04', href: 'lop5/bai04.html', stars: 15 } ] },
      { topic: 'Chủ đề 4. Đạo đức, pháp luật và văn hoá trong môi trường số', lessons: [ { n: 5, t: 'Bản quyền nội dung thông tin', id: 'l5-b05', href: 'lop5/bai05.html', stars: 11 } ] },
      { topic: 'Chủ đề 5. Ứng dụng tin học', lessons: [
        { n: 6, t: 'Định dạng kí tự và bố trí hình ảnh trong văn bản', id: 'l5-b06', href: 'lop5/bai06.html', stars: 13 }, { n: 7, t: 'Thực hành soạn thảo văn bản', id: 'l5-b07', href: 'lop5/bai07.html', stars: 10 },
        { n: '8A', t: 'Làm quen với phần mềm đồ hoạ', id: 'l5-b08a', href: 'lop5/bai08a.html', stars: 14 }, { n: '9A', t: 'Sử dụng phần mềm đồ hoạ tạo sản phẩm số', id: 'l5-b09a', href: 'lop5/bai09a.html', stars: 8 },
        { n: '8B', t: 'Làm sản phẩm thủ công theo video hướng dẫn', id: 'l5-b08b', href: 'lop5/bai08b.html', stars: 10 }, { n: '9B', t: 'Thực hành tạo đồ dùng gia đình theo video hướng dẫn', id: 'l5-b09b', href: 'lop5/bai09b.html', stars: 9 } ] },
      { topic: 'Chủ đề 6. Giải quyết vấn đề với sự trợ giúp của máy tính', lessons: [
        { n: 10, t: 'Cấu trúc tuần tự', id: 'l5-b10', href: 'lop5/bai10.html', stars: 10 },
        { n: 11, t: 'Cấu trúc lặp', id: 'l5-b11', href: 'lop5/bai11.html', stars: 10 },
        { n: 12, t: 'Thực hành sử dụng lệnh lặp', id: 'l5-b12', href: 'lop5/bai12.html', stars: 9 }, { n: 13, t: 'Cấu trúc rẽ nhánh', id: 'l5-b13', href: 'lop5/bai13.html', stars: 10 },
        { n: 14, t: 'Sử dụng biến trong chương trình', id: 'l5-b14', href: 'lop5/bai14.html', stars: 11 }, { n: 15, t: 'Sử dụng biểu thức trong chương trình', id: 'l5-b15', href: 'lop5/bai15.html', stars: 10 },
        { n: 16, t: 'Từ kịch bản đến chương trình', id: 'l5-b16', href: 'lop5/bai16.html', stars: 10 } ] }
    ]
  };
  var GRADE_KEY = 'whth-grade';

  /* the wide stage shows two columns (see main.css); narrow screens show one list */
  function isWide() { return !!(window.matchMedia && window.matchMedia('(min-width: 900px)').matches); }
  var shownGrade = null;
  window.addEventListener('resize', function () {
    var host = document.getElementById('lessons');
    if (shownGrade && host.getAttribute('data-wide') !== (isWide() ? '1' : '0')) renderLessons(shownGrade);
  });

  function renderLessons(grade) {
    shownGrade = grade;
    var host = document.getElementById('lessons');
    /* A grid of equal cards: every row counts as one lesson (9A and 9B are two).
       On the wide stage the first half is the left column and the rest the right
       column, row by row, so both sides line up. Each card carries a small
       "Chủ đề N" tag; the legend on the left gives the topic names. */
    var topics = GRADES[grade], cards = [], legend = '';
    for (var i = 0; i < topics.length; i++) {
      var ls = topics[i].lessons, tp = i + 1;
      legend += '<li><span class="topic-tag tp-' + tp + '">Chủ đề ' + tp + '</span><span>' + topics[i].topic.replace(/^Chủ đề \d+\.\s*/, '') + '</span></li>';
      for (var j = 0; j < ls.length; j++) {
        var l = ls[j], tag = '<span class="topic-tag tp-' + tp + '">Chủ đề ' + tp + '</span>';
        if (l.href) {
          cards.push('<a class="lesson-item" href="' + l.href + '" title="' + topics[i].topic + '"><span class="lesson-num tp-' + tp + '">' + l.n + '</span>' +
            '<span class="lesson-body"><span class="t">' + l.t + '</span><span class="lesson-meta">' + tag +
            '<span class="stars" data-stars-for="' + l.id + '" data-stars-total="' + l.stars + '"></span></span></span></a>');
        } else {
          cards.push('<div class="lesson-item soon"><span class="lesson-num">' + l.n + '</span>' +
            '<span class="lesson-body"><span class="t">' + l.t + '</span><span class="lesson-meta">' + tag + '<span class="tag-soon">Sắp có</span></span></span></div>');
        }
      }
    }
    var html = '', half = Math.ceil(cards.length / 2);
    if (isWide()) {
      for (var r = 0; r < half; r++) html += '<div class="lesson-row">' + cards[r] + (cards[half + r] || '<span class="lesson-gap"></span>') + '</div>';
    } else {
      html = '<div class="lesson-flat">' + cards.join('') + '</div>';
    }
    host.innerHTML = html;
    host.setAttribute('data-wide', isWide() ? '1' : '0');
    var lg = document.getElementById('topic-legend');
    if (lg) lg.innerHTML = legend;
    var tabs = document.querySelectorAll('[data-grade]');
    for (var k = 0; k < tabs.length; k++) tabs[k].setAttribute('aria-pressed', tabs[k].getAttribute('data-grade') === grade ? 'true' : 'false');
    try { localStorage.setItem(GRADE_KEY, grade); } catch (e) {}
    Core.renderStars();
  }

  /* ---------- who is learning: a name is needed to start, and each name has a 4-digit code ---------- */
  function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

  /* big card shown once, right after a new name is made */
  function showCode(name) {
    var m = Core.el('div', 'bip-modal', '<div class="bip-card code-card" role="dialog" aria-modal="true">' +
      '<h2>Chào ' + esc(name) + '!</h2>' +
      '<p>Mã số của em là</p>' +
      '<div class="code-big" aria-label="Mã số ' + Core.codeOf(name).split('').join(' ') + '">' + Core.codeOf(name) + '</div>' +
      '<p><b>Em hãy ghi nhớ mã số này</b> (chép vào vở cho chắc). Lần sau em cần <b>tên</b> và <b>mã số</b> để học tiếp và giữ sao của mình.</p>' +
      '<button class="btn btn-primary" type="button">Em đã ghi nhớ rồi</button></div>');
    document.body.appendChild(m);
    Core.on(m.querySelector('button'), function () { document.body.removeChild(m); });
  }

  /* a name that is already on this device opens only with its code */
  function askCode(name, note) {
    var box = document.getElementById('who-box');
    box.innerHTML = '<div id="code-ask"><form id="code-form" autocomplete="off"><label for="code-in">Mã số của <b>' + esc(name) + '</b>:</label>' +
      '<div class="who-row"><input class="input" id="code-in" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 chữ số" aria-label="Mã số 4 chữ số">' +
      '<button class="btn btn-primary" type="submit">Vào học</button></div></form></div>' +
      '<button class="btn btn-small" id="code-back" type="button">&lsaquo; Tên khác</button><div class="feedback" id="who-fb"></div>';
    var input = document.getElementById('code-in'), fb = document.getElementById('who-fb');
    if (note) Core.say(fb, note, 'info');
    Core.on(document.getElementById('code-back'), renderNames);
    input.focus();
    document.getElementById('code-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (Core.checkCode(name, input.value)) { Core.useProfile(name); refresh(); }
      else { Core.say(fb, 'Mã số chưa đúng. Em nhớ lại, hoặc hỏi thầy cô nha.', 'bad'); input.value = ''; input.focus(); }
    });
  }

  /* a learner who started on another device gets the stars back from the teacher's sheet (sync.js) */
  function askRestore() {
    var box = document.getElementById('who-box');
    box.innerHTML = '<div id="code-ask"><form id="restore-form" autocomplete="off"><label for="re-name">Tên và mã số của em:</label>' +
      '<div class="who-row"><input class="input" id="re-name" maxlength="20" placeholder="Tên em" aria-label="Tên của em">' +
      '<input class="input" id="re-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Mã số" aria-label="Mã số 4 chữ số"></div>' +
      '<button class="btn btn-primary" type="submit" id="re-go">Lấy lại bài học</button></form></div>' +
      '<button class="btn btn-small" id="code-back" type="button">&lsaquo; Quay lại</button><div class="feedback" id="who-fb"></div>';
    var fb = document.getElementById('who-fb'), go = document.getElementById('re-go');
    Core.on(document.getElementById('code-back'), renderNames);
    document.getElementById('re-name').focus();
    document.getElementById('restore-form').addEventListener('submit', function (e) {
      e.preventDefault();
      go.disabled = true;
      Core.say(fb, 'Đang tìm bài học của em...', 'info');
      Core.sync.restore(document.getElementById('re-name').value, document.getElementById('re-code').value, function (err) {
        go.disabled = false;
        if (!err) { refresh(); return; }
        Core.say(fb, err === 'bad' ? 'Em nhập đủ tên và mã số 4 chữ số nha.' :
          err === 'notfound' ? 'Không tìm thấy tên và mã số này. Em kiểm tra lại từng chữ, từng số nha.' :
          'Chưa kết nối được mạng. Em thử lại sau, hoặc nhờ thầy cô.', err === 'bad' ? 'info' : 'bad');
      });
    });
  }

  function renderNames() {
    var p = Core.profiles(), cur = p.current, box = document.getElementById('who-box');
    if (cur) {
      box.innerHTML = '<p class="who who-now">Đang học: <b>' + esc(cur) + '</b><br>Mã số của em: <b class="who-code">' + Core.codeOf(cur) + '</b></p>' +
        '<div class="who-row"><button class="btn btn-small" id="who-out" type="button">Bạn khác vào học</button>' +
        '<button class="btn btn-small" id="who-del" type="button">Xoá tên này</button></div><p class="who sync-state" data-sync-state></p>';
      if (Core.sync) Core.sync.paint();
      Core.on(document.getElementById('who-out'), function () { Core.logout(); refresh(); });
      Core.on(document.getElementById('who-del'), function () {
        if (confirm('Xoá tên "' + cur + '" và toàn bộ sao của bạn ấy?')) { Core.removeProfile(cur); refresh(); }
      });
    } else {
      box.innerHTML = '<p class="who">Em <b>nhập tên</b> để vào học.' + (p.list.length ? ' Bạn nào học rồi thì chạm vào tên của mình.' : '') + '</p>' +
        '<div class="names" id="names"></div>' +
        '<form id="add-name" autocomplete="off"><div class="who-row"><input class="input" id="new-name" maxlength="20" placeholder="Tên em, ví dụ: Bông" aria-label="Tên của em">' +
        '<button class="btn btn-primary" type="submit">Vào học</button></div></form>' +
        '<button class="btn btn-small" id="who-restore" type="button" data-sync-only' + (Core.sync && Core.sync.on ? '' : ' style="display:none"') + '>Em đã có mã số (học ở máy khác)</button><div class="feedback" id="who-fb"></div>' +
        '<a class="help-link" href="huongdan.html#dang-nhap">Xem hướng dẫn đăng nhập &rsaquo;</a>';
      var names =document.getElementById('names'), fb = document.getElementById('who-fb');
      for (var i = 0; i < p.list.length; i++) {
        (function (name) {
          var b = Core.el('button', 'btn btn-small', esc(name));
          b.type = 'button';
          Core.on(b, function () { askCode(name); });
          names.appendChild(b);
        })(p.list[i]);
      }
      Core.on(document.getElementById('who-restore'), askRestore);
      document.getElementById('add-name').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = Core.cleanName(document.getElementById('new-name').value);
        if (!name) { Core.say(fb, 'Em gõ tên của mình vào ô trước nha.', 'info'); return; }
        if (Core.hasProfile(name)) {
          askCode(name, 'Tên này đã có trên máy. Nếu là em, hãy nhập mã số. Nếu em là bạn khác trùng tên, hãy thêm một chữ vào tên, ví dụ: ' + esc(name) + ' B.');
          return;
        }
        Core.addProfile(name);
        refresh();
        showCode(name);
      });
    }
    /* lessons open only when someone is learning */
    var main = document.querySelector('.home-main'), note = document.getElementById('gate-note');
    main.className = 'home-main' + (cur ? '' : ' is-locked');
    document.querySelector('.home-side').className = 'home-side' + (cur ? '' : ' no-learner');
    note.style.display = cur ? 'none' : '';
  }

  function refresh() { renderNames(); Core.renderStars(); }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('brand-ico').innerHTML = Icons.robot;
    var grade = '4';
    try { grade = localStorage.getItem(GRADE_KEY) || '4'; } catch (e) {}
    renderLessons(grade);
    renderNames();
    var tabs = document.querySelectorAll('[data-grade]');
    for (var k = 0; k < tabs.length; k++) {
      (function (t) { Core.on(t, function () { renderLessons(t.getAttribute('data-grade')); }); })(tabs[k]);
    }
    /* a locked lesson card, or a lesson page opened without a name (#ten), points to the name box */
    function nudge() {
      var input = document.getElementById('new-name'), fb = document.getElementById('who-fb');
      if (!input) return;
      Core.say(fb, 'Em nhập tên trước rồi mới vào học được nha.', 'info');
      input.focus();
    }
    document.getElementById('gate-note').addEventListener('click', nudge, false);
    if (location.hash === '#ten' && !Core.currentName()) nudge();
  });
})();
</script>
</body>
</html>
