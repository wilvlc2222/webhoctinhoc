<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo BOSS – Tin học vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;subset=vietnamese&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=1114d">
<script src="assets/js/errbox.js?v=1114d"></script>
<script src="assets/js/icons.js?v=1114d"></script>
<script src="assets/js/core.js?v=1114d"></script>
<script src="assets/js/bossbank.js?v=1115a"></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="ico" id="brand-ico"></span>Tin học vui</a>
    <div class="topbar-right">
      <a class="btn btn-small btn-primary" href="index.html">&lsaquo; Về trang chủ</a>
      <button class="btn btn-small" id="eink-toggle" aria-pressed="false">Màn hình mực</button>
    </div>
  </div>
</header>

<!-- Boss challenge for one topic: thuthach.html?g=4&t=5 (grade, topic).
     A match is 20 questions = 20 points: the bug has 20 HP, a right answer is 1 point and 1 HP, three wrong answers lose.
     The page opens the topic's lessons in hidden frames and reuses their quiz and true/false questions
     (Core.quizBank in core.js / widgets.js), then adds the extra ones of assets/js/bossbank.js.
     tools/boss.html counts the questions of every topic. -->
<main class="wrap boss-cols">
  <div class="boss-side card">
    <div class="boss-bug" id="boss-bug" aria-hidden="true">
      <svg viewBox="0 0 120 110">
        <path d="M38 22 26 6M82 22 94 6" stroke="#1d2433" stroke-width="4" stroke-linecap="round"/>
        <circle cx="25" cy="5" r="4" fill="#e03131"/><circle cx="95" cy="5" r="4" fill="#e03131"/>
        <path d="M24 52 6 44M22 68 4 70M26 84 10 96M96 52l18-8M98 68l18 2M94 84l16 12" stroke="#1d2433" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="60" cy="62" rx="40" ry="42" fill="#845ef7" stroke="#1d2433" stroke-width="4"/>
        <path d="M60 22v82" stroke="#1d2433" stroke-width="3"/>
        <circle cx="42" cy="78" r="6" fill="#5f3dc4"/><circle cx="78" cy="78" r="6" fill="#5f3dc4"/><circle cx="48" cy="94" r="4" fill="#5f3dc4"/><circle cx="72" cy="94" r="4" fill="#5f3dc4"/>
        <circle cx="44" cy="50" r="11" fill="#fff" stroke="#1d2433" stroke-width="3"/><circle cx="76" cy="50" r="11" fill="#fff" stroke="#1d2433" stroke-width="3"/>
        <circle cx="46" cy="52" r="4.5" fill="#1d2433"/><circle cx="74" cy="52" r="4.5" fill="#1d2433"/>
        <path d="M31 36l22 8M89 36l-22 8" stroke="#1d2433" stroke-width="4" stroke-linecap="round"/>
        <path d="M50 68q10 -7 20 0" fill="none" stroke="#1d2433" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="boss-title">Big Bug</h1><p class="boss-vn">Bọ Lỗi</p>
    <p class="boss-topic" id="boss-topic"></p>
    <div class="boss-stat"><span>HP của BOSS: <b id="boss-hp-n"></b></span><div class="boss-hp" id="boss-hp"></div></div>
    <div class="boss-stat"><span>Điểm của em: <b id="boss-score"></b></span></div>
    <div class="boss-stat"><span>HP của em: <b id="boss-me-n"></b></span><div class="boss-hp boss-hp-me" id="boss-me"></div></div>
  </div>
  <div class="boss-main" id="boss-main"></div>
</main>

<script>
(function () {
  /* questions that point at a picture or text of their own lesson make no sense here */
  var NEEDS_PAGE = /(hình|bảng|ảnh|tranh|trang chiếu|chương trình|đoạn|văn bản|kịch bản|video|khối lệnh|lệnh|thư mục|cây|sơ đồ|chỉ dẫn)[^.?!]{0,25}(trên(?! (trang|màn hình|đó|dải|mạng|Internet))|bên(?! trong)|dưới|sau|này|sau đây)|ở trên|bên (trái|phải)|dưới đây|sau đây|trên đây|vừa (xem|đọc|làm|tạo)|ý tưởng của/i;
  /* "Câu nào dưới đây đúng?" points at its own options, so it is fine */
  var OPTIONS_BELOW = /(câu|thứ|trang web|việc|phần mềm|thiết bị) nào (dưới|sau) đây/gi;
  var TOTAL = 20;   /* questions and points of one match */
  var m = /[?&]g=(\d)/.exec(location.search), m2 = /[?&]t=(\d)/.exec(location.search);
  var grade = m ? +m[1] : 4, topic = m2 ? +m2[1] : 1;
  var main, bank = [], queue, hp, hpMax, hearts, asked, t0, started = false;

  function E(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function plain(html) { var d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  function bars() {
    var h = '', i;
    for (i = 0; i < (hpMax || 0); i++) h += '<span class="' + (i < hp ? 'on' : '') + '"></span>';
    document.getElementById('boss-hp').innerHTML = h;
    document.getElementById('boss-hp-n').innerHTML = hpMax ? hp + '/' + hpMax : '';
    document.getElementById('boss-score').innerHTML = hpMax ? (hpMax - hp) + '/' + hpMax : '';
    h = '';
    for (i = 0; i < 3; i++) h += '<span class="' + (i < hearts ? 'on' : '') + '"></span>';   /* the learner's 3 HP */
    document.getElementById('boss-me').innerHTML = h;
    document.getElementById('boss-me-n').innerHTML = hpMax ? hearts + '/3' : '';
  }
  function screen(html) { main.innerHTML = '<div class="card boss-card">' + html + '</div>'; }

  function intro() {
    hpMax = hp = TOTAL; hearts = 3; bars();
    screen('<h2>Solo BOSS · Chủ đề ' + topic + ' · Lớp ' + grade + '</h2>' +
      '<p class="boss-lead">BOSS <b>Bọ Lỗi</b> (Big Bug) đang phá các bài học của chủ đề <b>' + Core.TOPIC_NAMES[topic - 1] + '</b>. Em hãy đánh bại nó!</p>' +
      '<ul class="boss-rules"><li>BOSS có <b>' + TOTAL + ' HP</b>. Mỗi câu trả lời <b>đúng</b>: em được 1 điểm, BOSS mất 1 HP.</li>' +
      '<li>Em có <b>3 HP</b>. Mỗi câu trả lời <b>sai</b> làm em mất 1 HP. Câu đó sẽ được hỏi lại sau.</li>' +
      '<li>Đủ <b>' + TOTAL + ' điểm</b> thì BOSS thua. Thắng lần đầu, em được <b>3 kim cương</b>.</li></ul>' +
      '<button class="btn btn-boss" id="boss-go" type="button">' + (Core.swordsIcon || '') + 'Bắt đầu solo</button><div class="feedback" id="boss-fb"></div>');
    Core.on(document.getElementById('boss-go'), load);
  }

  /* open each lesson of the topic in a hidden frame and take its questions */
  function load() {
    var lessons = Core.topicLessons(grade, topic), i = 0, fb = document.getElementById('boss-fb'), seen = {};
    document.getElementById('boss-go').disabled = true;
    bank = [];
    function add(q, options, answer) {
      var key = plain(q);
      if (!key || seen[key] || NEEDS_PAGE.test(key.replace(OPTIONS_BELOW, '$1 nào')) || !options || options.length < 2 || answer == null || !options[answer]) return;
      /* options that differ only by a picture drawn with the lesson's own styles cannot be told apart here */
      for (var o = 0, texts = {}; o < options.length; o++) { var ot = plain(String(options[o])); if (!ot || texts[ot]) return; texts[ot] = 1; }
      seen[key] = 1;
      bank.push({ q: String(q).replace(/^\s*(<b>)?\s*(Câu|Bài|Luyện tập|Vận dụng)\s+\d+[.:]?\s*(<\/b>)?\s*/i, ''), options: options, answer: answer });
    }
    function next() {
      if (i >= lessons.length) {
        var ex = (window.BOSS_EXTRA || {})[grade + '-' + topic] || [];
        for (var x = 0; x < ex.length; x++) { if (ex[x].t) add(ex[x].t, ['Đúng', 'Sai'], ex[x].ok ? 0 : 1); else add(ex[x].q, ex[x].options, ex[x].answer); }
        return ready();
      }
      Core.say(fb, 'Đang chuẩn bị câu hỏi... (' + (i + 1) + '/' + lessons.length + ')', 'info');
      var f = E('iframe', 'boss-frame');
      f.setAttribute('aria-hidden', 'true'); f.setAttribute('tabindex', '-1');
      var done = false, timer = setTimeout(finish, 12000);
      function finish() {
        if (done) return;
        done = true; clearTimeout(timer);
        try {
          var list = (f.contentWindow.Core && f.contentWindow.Core.quizBank) || [];
          for (var a = 0; a < list.length; a++) {
            var b = list[a], k;
            if (b.type === 'quiz') for (k = 0; k < (b.questions || []).length; k++) add(b.questions[k].q, b.questions[k].options, b.questions[k].answer);
            if (b.type === 'tf') for (k = 0; k < (b.items || []).length; k++) add(b.items[k].t, ['Đúng', 'Sai'], b.items[k].ok ? 0 : 1);
          }
        } catch (e) {}
        if (f.parentNode) f.parentNode.removeChild(f);
        i++; next();
      }
      f.onload = function () { setTimeout(finish, 400); };
      f.src = Core.lessonHref(lessons[i]);
      document.body.appendChild(f);
    }
    next();
  }

  function ready() {
    if (bank.length < 4) {
      screen('<h2>Chưa có thử thách</h2><p>Chủ đề này chưa có đủ câu hỏi để solo với BOSS. Em chọn chủ đề khác nha.</p><a class="btn btn-primary" href="index.html">&lsaquo; Về trang chủ</a>');
      return;
    }
    queue = shuffle(bank.slice());
    hpMax = hp = Math.min(TOTAL, bank.length);   /* a wrong question goes back to the end of the queue, so it never runs out */
    hearts = 3; asked = 0; t0 = new Date().getTime();
    bars(); ask();
    if (Core.music) Core.music('boss');
  }

  function ask() {
    var q = queue.shift(), html = '<p class="boss-count">Câu ' + (++asked) + ' · BOSS còn <b>' + hp + '</b> HP</p><div class="boss-q">' + q.q + '</div><div class="quiz-options" id="boss-opts">', i;
    for (i = 0; i < q.options.length; i++) html += '<button class="btn quiz-opt" type="button" data-i="' + i + '"><span class="opt-letter">' + String.fromCharCode(65 + i) + '</span><span>' + q.options[i] + '</span></button>';
    screen(html + '</div><div class="feedback" id="boss-fb"></div>');
    /* answers drawn as Scratch scripts are tall: keep them side by side so the card still fits the frame */
    if (/sc-script/.test(q.options.join(''))) document.getElementById('boss-opts').className += ' boss-opts-row';
    var btns = main.querySelectorAll('.quiz-opt'), fb = document.getElementById('boss-fb'), bug = document.getElementById('boss-bug');
    for (i = 0; i < btns.length; i++) Core.on(btns[i], function () {
      var pick = +this.getAttribute('data-i'), ok = pick === q.answer, k;
      for (k = 0; k < btns.length; k++) btns[k].disabled = true;
      /* a wrong pick does not reveal the right option: the question comes back later and must be thought through */
      if (ok) {
        this.className += ' is-right';
        hp--;
        Core.say(fb, 'Trúng rồi! Em được 1 điểm, BOSS mất 1 HP.', 'good');
        bug.className = 'boss-bug is-hit';
        if (Core.sound) Core.sound('good');
        if (Core.react) Core.react('good');
      } else {
        hearts--; queue.push(q);
        this.className += ' is-wrong';
        Core.say(fb, 'Chưa đúng. Em mất 1 HP. Câu này sẽ quay lại sau, em suy nghĩ kĩ nha.', 'bad');
        if (Core.sound) Core.sound('bad');
        if (Core.react) Core.react('bad');
      }
      bars();
      var go = E('button', 'btn btn-primary boss-next', hp <= 0 || hearts <= 0 ? 'Xem kết quả' : 'Câu tiếp &rsaquo;');
      go.type = 'button';
      main.querySelector('.boss-card').appendChild(go);
      Core.on(go, function () {
        bug.className = 'boss-bug';
        if (hp <= 0) return win();
        if (hearts <= 0 || !queue.length) return lose();
        ask();
      });
      go.focus();
    });
  }

  function win() {
    if (Core.music) Core.music(null);
    var secs = Math.round((new Date().getTime() - t0) / 1000), first = !Core.gems.bossWon(grade, topic), i;
    if (first) for (i = 1; i <= 3; i++) Core.gems.add('boss_g' + grade + '_t' + topic + '_' + i);
    document.getElementById('boss-bug').className = 'boss-bug is-down';
    screen('<h2>Em đã thắng BOSS Bọ Lỗi!</h2><p class="boss-lead">Em đánh bại Bọ Lỗi của chủ đề ' + topic + ' với <b>' + hpMax + '/' + hpMax + ' điểm</b> trong <b>' + secs + '</b> giây, còn <b>' + hearts + '</b> HP.</p>' +
      (first ? '<p class="boss-reward">' + Core.gemIcon + 'Phần thưởng thắng lần đầu: <b>+3 kim cương</b></p>' : '<p>Em đã nhận phần thưởng của thử thách này từ lần thắng trước.</p>') +
      '<div class="bip-actions"><button class="btn" id="boss-again" type="button">Đấu lại</button><a class="btn btn-primary" href="index.html">&lsaquo; Về trang chủ</a></div>');
    Core.on(document.getElementById('boss-again'), ready);
    if (Core.sound) Core.sound('level');
    if (Core.react) Core.react('win');
    if (Core.checkBadges) setTimeout(function () { Core.checkBadges(); }, 1300);
  }
  function lose() {
    if (Core.music) Core.music(null);
    screen('<h2>BOSS thắng lần này</h2><p class="boss-lead">Em được <b>' + (hpMax - hp) + '/' + hpMax + ' điểm</b>. Không sao cả! Em xem lại các bài của chủ đề ' + topic + ' rồi đấu lại nha. BOSS còn <b>' + hp + '</b> HP.</p>' +
      '<div class="bip-actions"><a class="btn" href="index.html">&lsaquo; Về trang chủ</a><button class="btn btn-primary" id="boss-again" type="button">Đấu lại</button></div>');
    Core.on(document.getElementById('boss-again'), ready);
  }

  function start() {
    if (started) return;
    if (!Core.currentName()) { location.replace('index.html#ten'); return; }
    if (!Core.topicLessons || topic < 1 || topic > 6 || !Core.topicLessons(grade, topic).length) { location.replace('index.html'); return; }
    started = true;
    main = document.getElementById('boss-main');
    document.getElementById('boss-topic').innerHTML = 'Chủ đề ' + topic + ' · Lớp ' + grade;
    intro();
  }
  /* game.js (lesson table, gems) is loaded by core.js a moment after this page */
  Core.onGameReady = start;
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('brand-ico').innerHTML = Icons.robot;
    if (Core.topicLessons) start();
  });
})();
</script>
</body>
</html>
